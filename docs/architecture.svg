<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Edge Vision Monitor system architecture</title><desc id="desc">Layered deployment architecture showing hardware, application services, data persistence, and browser clients.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081522"/><stop offset="1" stop-color="#112b43"/></linearGradient><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0L7 3L0 6Z" fill="#6bded3"/></marker></defs><rect width="1400" height="760" rx="24" fill="url(#bg)"/><text x="64" y="64" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#5fe0d3">EDGE VISION MONITOR</text><text x="64" y="108" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="750" fill="#f3f8ff">System architecture</text><text x="64" y="139" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#9db8ca">Separation of hardware access, application services, persistence and client presentation</text><g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="64" y="178" width="1272" height="120" rx="15" fill="#102a40" stroke="#315970"/><text x="88" y="207" font-size="14" font-weight="700" letter-spacing="1.6" fill="#8bb7d0">HARDWARE &amp; HOST OS</text><g fill="#173c50" stroke="#36788a"><rect x="88" y="224" width="280" height="52" rx="10"/><rect x="390" y="224" width="280" height="52" rx="10"/><rect x="692" y="224" width="280" height="52" rx="10"/><rect x="994" y="224" width="318" height="52" rx="10"/></g><g font-size="16" fill="#eaf7ff" text-anchor="middle"><text x="228" y="255">Raspberry Pi 5 · Linux</text><text x="530" y="255">Hailo-8L · PCIe / HailoRT</text><text x="832" y="255">CSI / USB / video files</text><text x="1153" y="255">hwmon · thermal · vcgencmd</text></g><path d="M700 298v32" stroke="#6bded3" stroke-width="3" marker-end="url(#arr)"/><rect x="64" y="340" width="1272" height="192" rx="15" fill="#11283e" stroke="#3e657e"/><text x="88" y="369" font-size="14" font-weight="700" letter-spacing="1.6" fill="#8bb7d0">APPLICATION SERVICES · PYTHON / ASYNCIO + WORKERS</text><g fill="#153b43" stroke="#3bc7b8"><rect x="88" y="388" width="278" height="60" rx="10"/><rect x="390" y="388" width="278" height="60" rx="10"/><rect x="692" y="388" width="278" height="60" rx="10"/><rect x="994" y="388" width="318" height="60" rx="10"/></g><g font-size="16" fill="#efffff" text-anchor="middle"><text x="227" y="413">Video source manager</text><text x="227" y="434" font-size="13" fill="#a8d9d4">capture · switch · playback</text><text x="529" y="413">Inference worker</text><text x="529" y="434" font-size="13" fill="#a8d9d4">preprocess · NPU · decode</text><text x="831" y="413">Telemetry collector</text><text x="831" y="434" font-size="13" fill="#a8d9d4">independent sensor polling</text><text x="1153" y="413">FastAPI service</text><text x="1153" y="434" font-size="13" fill="#a8d9d4">REST · WebSocket · MJPEG</text></g><path d="M227 448v32h302v-32M529 448v32M831 448v32h-302M1153 448v32h-322" fill="none" stroke="#6bded3" stroke-width="2" stroke-dasharray="5 5"/><text x="700" y="508" font-size="14" text-anchor="middle" fill="#9db8ca">Bounded queues and explicit metric availability states isolate slow I/O from inference</text><path d="M700 532v32" stroke="#6bded3" stroke-width="3" marker-end="url(#arr)"/><rect x="64" y="574" width="610" height="102" rx="14" fill="#302944" stroke="#9c87df"/><text x="88" y="604" font-size="14" font-weight="700" letter-spacing="1.4" fill="#d2c5ff">PERSISTENCE</text><text x="88" y="632" font-size="18" font-weight="650" fill="#fbf7ff">SQLite · WAL · asynchronous batch writer</text><text x="88" y="656" font-size="14" fill="#d0c6e6">Telemetry samples · inference frames · detections · events</text><rect x="704" y="574" width="632" height="102" rx="14" fill="#15384a" stroke="#579dca"/><text x="728" y="604" font-size="14" font-weight="700" letter-spacing="1.4" fill="#b9e0ff">CLIENT &amp; OPERATIONS</text><text x="728" y="632" font-size="18" font-weight="650" fill="#f1f8ff">Browser dashboard · Chart.js · CSV exports</text><text x="728" y="656" font-size="14" fill="#b4cddd">Podman deployment · liveness and readiness endpoints</text><text x="64" y="720" font-size="14" fill="#8da9bc">Design intent; actual service boundaries and supported interfaces depend on the implementation and host configuration.</text></g></svg>