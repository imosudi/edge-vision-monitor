<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">Edge Vision Monitor data pipeline</title><desc id="desc">Video sources feed a bounded frame queue and YOLO11 Hailo-8L inference; detections and annotated frames flow to FastAPI, while independent telemetry and inference records flow to SQLite.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081522"/><stop offset="1" stop-color="#102b42"/></linearGradient><linearGradient id="teal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43d9c8"/><stop offset="1" stop-color="#6aabff"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6Z" fill="#62d9d0"/></marker></defs><rect width="1400" height="760" rx="24" fill="url(#bg)"/><text x="64" y="62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#5fe0d3">EDGE VISION MONITOR</text><text x="64" y="105" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="750" fill="#f3f8ff">Inference and telemetry data flow</text><text x="64" y="137" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#9db8ca">Bounded video path · asynchronous persistence · independent hardware polling</text><g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="64" y="184" width="1272" height="112" rx="16" fill="#112b40" stroke="#315970"/><text x="88" y="214" font-size="14" font-weight="700" letter-spacing="1.5" fill="#8bb7d0">01 / VIDEO SOURCES</text><g fill="#173d50" stroke="#36788a"><rect x="88" y="230" width="245" height="44" rx="9"/><rect x="354" y="230" width="245" height="44" rx="9"/><rect x="620" y="230" width="245" height="44" rx="9"/><rect x="886" y="230" width="420" height="44" rx="9"/></g><g font-size="16" fill="#eaf7ff" text-anchor="middle"><text x="210" y="257">Raspberry Pi CSI camera</text><text x="476" y="257">USB webcam · V4L2</text><text x="742" y="257">Prerecorded video</text><text x="1096" y="257">Runtime source selection + playback</text></g><path d="M700 296v36" stroke="#62d9d0" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="340" width="540" height="66" rx="14" fill="#143b43" stroke="#3bc7b8" stroke-width="2"/><text x="700" y="367" font-size="14" font-weight="700" letter-spacing="1.4" text-anchor="middle" fill="#80eee2">02 / FRAME QUEUE</text><text x="700" y="390" font-size="17" text-anchor="middle" fill="#f0ffff">Bounded depth 2 · drop stale frames</text><path d="M700 406v32" stroke="#62d9d0" stroke-width="3" marker-end="url(#arrow)"/><rect x="310" y="446" width="780" height="96" rx="16" fill="#172b4b" stroke="#6c91e8" stroke-width="2"/><text x="700" y="475" font-size="14" font-weight="700" letter-spacing="1.4" text-anchor="middle" fill="#9db8ff">03 / YOLO11 INFERENCE ENGINE</text><text x="700" y="504" font-size="19" font-weight="650" text-anchor="middle" fill="#f5f8ff">Letterbox → HailoRT / Hailo-8L NPU → decode + NMS</text><text x="700" y="527" font-size="13" text-anchor="middle" fill="#a9bdd5">Tracks preprocessing, accelerator execution and post-processing separately</text><path d="M500 542v30H340v28M900 542v30h160v28" fill="none" stroke="#62d9d0" stroke-width="3" marker-end="url(#arrow)"/><rect x="64" y="612" width="552" height="88" rx="14" fill="#113b3d" stroke="#3bc7b8"/><text x="88" y="640" font-size="14" font-weight="700" letter-spacing="1.3" fill="#82eee2">04A / FASTAPI DASHBOARD</text><text x="88" y="669" font-size="17" fill="#efffff">MJPEG preview · WebSocket state · REST API</text><rect x="784" y="612" width="552" height="88" rx="14" fill="#302944" stroke="#9c87df"/><text x="808" y="640" font-size="14" font-weight="700" letter-spacing="1.3" fill="#d2c5ff">04B / SQLITE STORAGE WORKER</text><text x="808" y="669" font-size="17" fill="#fbf7ff">WAL batches · retention pruning · CSV export</text><rect x="64" y="714" width="1272" height="28" rx="8" fill="#102638"/><text x="700" y="733" font-size="13" text-anchor="middle" fill="#9cb7c8">Independent telemetry collector: hwmon · thermal zones · /proc/stat · vcgencmd · process / cgroup metrics</text></g></svg>