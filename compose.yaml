# ==============================================================================
# Edge Vision Monitor - Container Service Deployment (Podman / Docker Compose)
#
# Container Architecture Options:
#   Option 1: Monolithic Container (compose.yaml - Current File)
#             Single unified container, ~195 MB RSS footprint, simple deployment.
#             Command: python3 main.py compose up -d
#
#   Option 2: Microservices Decomposition (compose.microservices.yaml)
#             5 decomposed least-privilege containers, segmented failure domains,
#             zero-copy shared memory (/dev/shm), and isolated hardware permissions:
#               - edge-vision-ingress   (/dev/video*, /dev/media*, /dev/shm)
#               - edge-vision-inference (/dev/hailo0, /dev/shm)
#               - edge-vision-telemetry (/sys/class/hwmon:ro, /sys/class/thermal:ro)
#               - edge-vision-storage   (./data:/app/data:Z)
#               - edge-vision-gateway   (Port 8000:8000, unprivileged web & API)
#             Command: python3 main.py compose --microservices up -d
#             Matrix:  python3 main.py compose matrix
# ==============================================================================

services:
  edge-vision-monitor:
    build:
      context: .
      dockerfile: Containerfile
    image: edge-vision-monitor:latest
    container_name: edge-vision-monitor
    restart: unless-stopped
    network_mode: host
    ports:
      - "8000:8000"

    # Group membership for hardware device node access
    group_add:
      - "video"
      - "44"

    # Least-privilege hardware device mapping
    devices:
      # Hailo-8L PCIe accelerator node
      - "/dev/hailo0:/dev/hailo0:rwm"

    # Device cgroup access rules for Raspberry Pi 5 ISP & Camera Subsystem
    device_cgroup_rules:
      - "c 81:* rmw"   # V4L2 video and subdev devices (/dev/video*, /dev/v4l-subdev*)
      - "c 511:* rmw"  # Media controller devices (/dev/media*)
      - "c 252:* rmw"  # DMA-BUF heap allocators (/dev/dma_heap/*)
      - "c 245:* rmw"  # RP1 ISP DMA memory

    # Volume mounts with security labeling (:Z for SELinux / rootless Podman)
    volumes:
      # Shared memory IPC buffer
      - "/dev/shm:/dev/shm"
      # Hardware device tree and nodes
      - "/dev:/dev"
      - "/run/udev:/run/udev:ro"
      # Read-only hardware telemetry sysfs interfaces
      - "/sys:/sys:ro"
      # Writable persistent SQLite time-series storage
      - "./data:/app/data:Z"
      # Read-only model binaries and labels
      - "./models:/app/models:ro,Z"
      # Read-only prerecorded video files
      - "./media:/app/media:ro,Z"
      # Application configuration override
      - "./config/config.yaml:/app/config/config.yaml:ro,Z"
      # Application source code
      - "./app:/app/app:ro"
      - "./main.py:/app/main.py:ro"

    environment:
      - EVM_SERVER__HOST=0.0.0.0
      - EVM_SERVER__PORT=8000
      - EVM_CONFIG_PATH=/app/config/config.yaml
      - EVM_SERVER__LOG_LEVEL=INFO

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
